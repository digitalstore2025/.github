name: Security Baseline Self-Test

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'security/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate baseline integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n security/scripts/security-local.sh
      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file"
          done < <(find .github/workflows security/templates -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool security/versions.json >/dev/null
          python -m json.tool security/templates/renovate.json >/dev/null
          python -m json.tool security/MANIFEST.json >/dev/null
      - name: Validate pins, review invariants, and manifest
        run: python security/scripts/validate-baseline.py .
