name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      languages_json:
        description: JSON array of CodeQL languages, for example ["javascript-typescript","python"].
        required: false
        type: string
        default: '["javascript-typescript"]'
      queries:
        description: CodeQL query suite.
        required: false
        type: string
        default: security-extended

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
