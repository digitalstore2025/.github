name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  codeql:
    uses: digitalstore2025/.github/.github/workflows/codeql-reusable.yml@5b577b1078c9f1f8bd368d0cbaabd84f84c5d59c
    with:
      matrix_json: '[{"language":"javascript-typescript","build_mode":"none"},{"language":"python","build_mode":"none"}]'
      queries: security-extended
